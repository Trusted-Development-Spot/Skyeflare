name: Hosting Deal Sync & Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Automatically checks prices & expired coupons every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  sync-deals:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Autonomous Deal & Coupon Sync
        run: python3 scripts/update_deals.py

      - name: Validate JSON Integrity
        run: python3 -m json.tool data/hosting-deals.json > /dev/null

      - name: Commit & push live deal updates
        run: |
          git config user.name "SkyeFlare Deal Bot"
          git config user.email "bot@skyeflare.com"
          git add data/hosting-deals.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deals): automated coupon & pricing sync"
            git push
          else
            echo "No changes to commit."
          fi

  build-and-deploy:
    needs: sync-deals
    if: always() && (needs.sync-deals.result == 'success' || needs.sync-deals.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and verify build
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages (if Actions source enabled)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
